<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    .container{
      height: 748px;
      width: 748px;
      display: grid;
      gap: 9px;
      border: 10px;
      grid-template-columns: 320px 198px 153px 1fr;
      grid-template-rows: 414px 130px 155px 1fr;
      background-color: #000;
    }

    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .red{
      height: 414px;
      
      column-span: 1;
      background-color: #E72F24;
    }

    .white{
      grid-column: span 3;
      background-color: #F0F1EC;
      order: 0;
    }

    .whiteii{
      height: 295px;
      width: 320px;
      background-color: #F0F1EC;
      order: 0;
      grid-column-start: 2;
      grid-column-end: 1;
    }

    .whieiii{
      grid-area: 2/2/4/4;
      background-color: #F0F1EC;
      order: 0;
    }

    .blue{
      height: 130px;
      width: 50px;
      background-color: #004592;
      grid-column-start: -1;
      grid-column-end: 4;
    }

    .longwhite{
      height: 176px;
      width: 50px;
      background-color: #F0F1EC;
      grid-column-start: -1;
      grid-column-end: 4;
      border-top: 10px solid;
    }

    .row3{
      height: 20;
      width: 320px;
      background-color: #F0F1EC;
      order: 0;
      grid-row-start: 5;
      grid-row-end: 4;
    }

    .yellow{
      height: 20;
      width: 198px;
      background-color: #F9D01E;
      order: 0;
      grid-row-start: 5;
      grid-row-end: 4;
    }

    .black{
      height: 20;
      width: 153px;
      background-color: #28261e;
    }

  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="container">
    <div class="red"></div>
    <div class="white"></div>
    <div class="whiteii"></div>
    <div class="whieiii"></div>
    <div class="blue"></div>
    <div class="longwhite"></div>
    <div class="row3"></div>
    <div class="yellow"></div>
    <div class="black"></div>
   </div>
</body>

</html>
